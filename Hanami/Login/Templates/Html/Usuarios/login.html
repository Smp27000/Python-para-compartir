{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <h2 class="text-center mt-3">Bienvenidos Hanami</h2>

  <div class="container mt-5">
    <div class="row justify-content-center">

      <div class="col-md-4">
        <div class="card p-4">
          <h4 class="text-center">Iniciar sesión</h4>
          <form action="/User/login" method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <input type="text" class="form-control" placeholder="Usuario" name="usu" />
            </div>
            <div class="mb-3">
              <input type="password" class="form-control" placeholder="Password" name="pass" />
            </div>
            <span style="color: red;">{{ mensajeerror }}</span>
            <div class="d-grid mt-2">
              <button type="submit" class="btn btn-primary">Iniciar sesión</button>
            </div>
          </form>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-4">
          <h4 class="text-center">Crear Cuenta</h4>
          <form action="/User/registro" method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <input type="text" class="form-control" placeholder="Usuario" name="user" />
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" placeholder="Nombre" name="nombre" />
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" placeholder="Apellido" name="apellido" />
            </div>
            <div class="mb-3">
              <input type="email" class="form-control" placeholder="Email" name="email" />
            </div>
            <div class="mb-3">
              <input type="password" class="form-control" placeholder="Password" name="pass" />
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-success">Crear Usuario</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

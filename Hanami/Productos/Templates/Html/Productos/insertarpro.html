{% load static %}
{% include 'Inc/header.html' %}
<div class="container">
    <h1 class="text-center my-4">Formulario Insertar Productos</h1>
    <div class="card p-4 col-md-8 mx-auto">
        <form action="" method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
            {% csrf_token %}
            <div class="row align-items-center">
                <div class="col-6">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="nombre" placeholder="Nombre"
                               name="nombre" value="{{nombre|default:''}}" required>
                        <label for="nombre">Nombre:</label>
                        <div class="valid-feedback">Todo ok</div>
                        <div class="invalid-feedback">Escriba el nombre</div>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="number" class="form-control" id="precio" placeholder="Precio"
                               name="precio" value="{{precio|default:''}}" required>
                        <label for="precio">Precio:</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="date" class="form-control" id="fecha" placeholder="Fecha"
                               name="fecha" value="{{fecha|default:''}}" required>
                        <label for="fecha">Fecha:</label>
                    </div>
                </div>
                <div class="col-6">
                    <div class="form-floating mb-3">
                        <input type="file" class="form-control" id="foto" placeholder="Foto"
                               name="foto" accept="image/*" required>
                        <label for="foto">Foto:</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="number" class="form-control" id="cantidad" placeholder="Cantidad"
                               name="cantidad" value="{{cantidad|default:''}}" required>
                        <label for="cantidad">Cantidad:</label>
                    </div>
                    <div class="form-floating mb-3">
                        <select class="form-select" id="prover" name="prover" required>
                            <option value="" disabled selected>Seleccione opción</option>
                            {% for d in provers %}
                                <option value="{{d.id}}">{{ d.nombre }}</option>
                            {% endfor %}
                        </select>
                        <label for="prover">Proveedores:</label>
                    </div>
                </div>
            </div>
            <div class="col-12 mt-3">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="descri" placeholder="Descripción"
                           name="descri" value="{{descripcion|default:''}}" required>
                    <label for="descri">Descripción:</label>
                </div>
            </div>
            {% if mensa %}
                <h5 class="text-danger text-center">{{ mensa }}</h5>
            {% endif %}
            <div class="col-12 text-center mt-3">
                <button type="submit" class="btn btn-primary px-5 py-2">Registrar</button>
            </div>
        </form>
    </div>
</div>

<script>
(() => {
    'use strict'
    const forms = document.querySelectorAll('.needs-validation')
    Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
            }
            form.classList.add('was-validated')
        }, false)
    })
})()
</script>
{% include 'Inc/footer.html' %}
